[project]
name = "studio-generative"
version = "0.1.0"
description = "Local generative music bridge for the Antaine + Alex studio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0.0",
  "sounddevice>=0.5.0",
]

[project.scripts]
studio-generative = "studio_generative.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio_generative"]

[tool.pytest.ini_options]
testpaths = ["tests"]
